name: Python package

on:
  push:
    branches:
    - '**'
    tags:
    - 'v*'

jobs:
  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: pypa/cibuildwheel@v2.21.3
      env:
        # Build CPython 3.8–3.12 only; skip PyPy (poor numpy support)
        CIBW_BUILD: cp38-* cp39-* cp310-* cp311-* cp312-*
        # Build native arm64 wheels on macos-14, plus x86_64 via Rosetta
        CIBW_ARCHS_MACOS: arm64 x86_64
        CIBW_ARCHS_LINUX: auto64
        CIBW_ARCHS_WINDOWS: auto64
        CIBW_BEFORE_ALL_MACOS: brew install llvm libomp
        # The wheel test runs inside the manylinux2014 (glibc 2.17) image,
        # whose GCC is 10.2.1. numpy >= 2.3 dropped manylinux2014 wheels
        # (it ships manylinux_2_28 only), so pip would fall back to building
        # numpy from source in the test venv — and numpy's meson build
        # requires GCC >= 10.3, which the image doesn't have. Pre-install a
        # numpy that still publishes manylinux2014 wheels so the smoke test
        # installs a binary instead of compiling from source. This only
        # affects the CI test environment, not the numpy users get at runtime.
        CIBW_BEFORE_TEST_LINUX: pip install "numpy<2.3"
        # Include both Homebrew prefixes: /opt/homebrew (arm64) and /usr/local (x86_64/Rosetta)
        CIBW_ENVIRONMENT_MACOS: >-
          CC="clang" CXX="clang++"
          PATH="/opt/homebrew/opt/llvm/bin:/usr/local/opt/llvm/bin:$PATH"
          LDFLAGS="-L/opt/homebrew/opt/llvm/lib -L/usr/local/opt/llvm/lib"
          CPPFLAGS="-I/opt/homebrew/opt/llvm/include -I/usr/local/opt/llvm/include"
        CIBW_BEFORE_BUILD_MACOS: clang --version
        # Import-and-query smoke test for every built wheel — catches a
        # wrong SIMD baseline (SIGILL) at build time instead of on user
        # machines.
        CIBW_TEST_COMMAND: >-
          python -c "import numpy as np, pynear;
          idx = pynear.VPTreeL2Index();
          idx.set(np.random.rand(256, 8).astype(np.float32));
          i, d = idx.searchKNN(np.random.rand(4, 8).astype(np.float32), 3);
          assert len(i) == 4 and len(i[0]) == 3"
        # macOS x86_64 wheels are cross-compiled and would be tested under
        # Rosetta 2 on the arm64 runner. Rosetta on macOS 14 supports only
        # up to SSE4.2, so the AVX2 baseline would trap there even though
        # the wheel runs fine on real Intel Macs (all of which have AVX2).
        CIBW_TEST_SKIP: "*-macosx_x86_64"
        CIBW_BUILD_VERBOSITY: 1
    - uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}
        path: ./wheelhouse/*.whl

  # Compile-only check that the AVX-512 distance kernels (gated by
  # __AVX512F__) build without errors when the compiler is forced into
  # AVX-512 mode. We do NOT execute the binary because GitHub runners
  # may be AMD EPYC (no AVX-512) and would crash with SIGILL.
  #
  # We tried Intel SDE for emulated execution but Intel rotates the
  # download URL frequently. A compile check catches the most common
  # regression (a typo in the __AVX512F__ block that nobody compiles
  # locally because their dev machine has no AVX-512). Live perf
  # validation requires real AVX-512 hardware.
  build-check-avx512:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install build deps
      run: |
        sudo apt update
        sudo apt install -y build-essential libgomp1
        python -m pip install --upgrade pip
        python -m pip install numpy pybind11
    - name: Compile DistanceFunctions.hpp with AVX-512 forced on
      run: |
        # Use a tiny stub TU that includes the header and calls each
        # __AVX512F__-gated symbol — that way the compiler is forced to
        # instantiate the AVX-512 templates.
        cat > /tmp/avx512_check.cpp <<'EOF'
        #include "DistanceFunctions.hpp"
        int main() {
        #if defined(__AVX512F__)
            int8_t x[64] = {0}, y[64] = {0};
            volatile int32_t r = dist_l2sq_sq8_avx512(x, y, 64);
            (void)r;
            const float q[16] = {0};
            const float v0[16] = {0}, v1[16] = {0}, v2[16] = {0}, v3[16] = {0};
            const float v4[16] = {0}, v5[16] = {0}, v6[16] = {0}, v7[16] = {0};
            const float* vs[8] = {v0,v1,v2,v3,v4,v5,v6,v7};
            float out[8];
            batch_dot_f_avx512_8(q, 16, vs, 8, out);
        #else
        #  error "Expected __AVX512F__ to be defined under these flags"
        #endif
            return 0;
        }
        EOF
        g++ -O3 -std=c++17 \
            -march=skylake-avx512 -mavx512f -mavx512bw -mfma \
            -I pynear/include \
            -c /tmp/avx512_check.cpp -o /tmp/avx512_check.o
        echo "AVX-512 kernels compiled successfully."

  build-sdist:
    needs: build-wheels
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Build sdist
      run: |
        python -m pip install build
        python -m build --sdist
    - uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: ./dist/*.tar.gz

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true
    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        generate_release_notes: true

  upload-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true
    - uses: pypa/gh-action-pypi-publish@release/v1
